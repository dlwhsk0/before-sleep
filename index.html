<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 브라우저 UI도 앱 배경에 맞춘다 (다크가 기본) -->
    <meta name="theme-color" content="#12100e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="자기 전에" />
    <title>자기 전에</title>

    <!--
      본문은 시스템 한글 글꼴을 쓰고, 웹폰트는 두 개만 받는다.
      Gowun Batang: 날짜·제목용 명조. IBM Plex Mono: 시각 표시용(라틴 숫자뿐이라 가볍다).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <script>
      // 첫 페인트 전에 테마를 확정해 화면이 번쩍이지 않게 한다.
      // 키는 src/lib/settings.ts의 STORAGE_KEY와 같아야 한다.
      try {
        var s = JSON.parse(localStorage.getItem('before-sleep:settings') || '{}')
        if (s.theme === 'light' || s.theme === 'dark') {
          document.documentElement.setAttribute('data-theme', s.theme)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
