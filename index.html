<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 브라우저 UI도 앱 배경에 맞춘다 (다크가 기본) -->
    <meta name="theme-color" content="#101a2f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f5fb" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="자기 전에" />
    <title>자기 전에</title>

    <script>
      // 첫 페인트 전에 테마를 확정해 화면이 번쩍이지 않게 한다.
      // 키는 src/lib/settings.ts의 STORAGE_KEY와 같아야 한다.
      try {
        var s = JSON.parse(localStorage.getItem('before-sleep:settings') || '{}')
        // 저장된 값이 없으면 다크. src/lib/settings.ts의 DEFAULT_SETTINGS와 같아야 한다.
        var t = s.theme || 'dark'
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
